
name: Secure Windows RDP + Tailscale V2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      # STEP 1: Secure Windows configuration
      - name: Configure Secure RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== CONFIGURING WINDOWS ==="

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing RDP_PASSWORD GitHub Secret."
          }

          if ($env:RDP_PASSWORD.Length -lt 16) {
            throw "RDP password must contain at least 16 characters."
          }

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          # Create or update dedicated RDP account
          $user = Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser -Name "RDP" `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -Description "Temporary remote development user"
          }

          Enable-LocalUser -Name "RDP"

          # Allow RDP login without administrator privileges
          $members = Get-LocalGroupMember `
            -Group "Remote Desktop Users"

          $accountName = "$env:COMPUTERNAME\RDP"

          if (-not ($members | Where-Object {
            $_.Name -eq $accountName
          })) {
            Add-LocalGroupMember `
              -Group "Remote Desktop Users" `
              -Member "RDP"
          }

          # Disable broad built-in RDP firewall rules
          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          # Record job start for controlled shutdown
          $started = (Get-Date).ToUniversalTime().ToString("o")

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "JOB_STARTED_UTC=$started"

          Write-Host "RDP user configured."
          Write-Host "Password is stored in GitHub Secrets."

      # STEP 2: Connect to Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-dev-${{ github.run_id }}
          version: latest

      # STEP 3: Secure firewall and enable RDP
      - name: Configure Private RDP Access
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== CHECKING TAILSCALE ==="

          $ts = Join-Path $env:ProgramFiles `
            "Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            $ts = (Get-Command tailscale.exe `
              -ErrorAction Stop).Source
          }

          $tsIP = (& $ts ip -4 | Select-Object -First 1)

          if ($LASTEXITCODE -ne 0 -or
              [string]::IsNullOrWhiteSpace($tsIP)) {
            throw "Tailscale IP unavailable."
          }

          $tsIP = $tsIP.Trim()

          $adapter = Get-NetAdapter |
            Where-Object {
              $_.Name -like "*Tailscale*" -or
              $_.InterfaceDescription -like "*Tailscale*"
            } |
            Select-Object -First 1

          if (-not $adapter) {
            throw "Tailscale network adapter not found."
          }

          Write-Host "Tailscale connected: $tsIP"

          # Create a narrow inbound firewall rule
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -Direction Inbound `
            -Action Allow `
            -Enabled True `
            -Protocol TCP `
            -LocalPort 3389 `
            -LocalAddress $tsIP `
            -RemoteAddress "100.64.0.0/10" `
            -InterfaceAlias $adapter.Name `
            -Profile Any | Out-Null

          # Windows Remote Desktop configuration
          $serverPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

          $rdpPath = "$serverPath\WinStations\RDP-Tcp"

          Set-ItemProperty `
            -Path $serverPath `
            -Name "fDenyTSConnections" `
            -Value 0

          # Require Network Level Authentication
          Set-ItemProperty `
            -Path $rdpPath `
            -Name "UserAuthentication" `
            -Value 1

          # Require TLS security layer
          Set-ItemProperty `
            -Path $rdpPath `
            -Name "SecurityLayer" `
            -Value 2

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          # Verify local RDP listener
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP service is not listening on TCP 3389."
          }

          Write-Host ""
          Write-Host "======================================"
          Write-Host "RDP CONFIGURATION READY"
          Write-Host "======================================"
          Write-Host "Computer: $tsIP"
          Write-Host "Username: .\RDP"
          Write-Host "Port: 3389"
          Write-Host "Password: Stored in GitHub Secrets"
          Write-Host "======================================"

          # Store non-sensitive connection details
          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "### Remote development connection"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "Tailscale IP: $tsIP"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "Username: .\RDP"

          Add-Content `
            -Path $env:GITHUB_STEP_SUMMARY `
            -Value "RDP Port: 3389"

      # STEP 4: Diagnostics
      - name: System Diagnostics
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS VERSION ==="

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "=== CPU ==="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfLogicalProcessors

          Write-Host "=== MEMORY ==="

          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

          Write-Host "=== STORAGE ==="

          Get-PSDrive C

          Write-Host "=== RDP STATUS ==="

          Get-Service TermService

          Write-Host "=== FIREWALL RULE ==="

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only"

      # STEP 5: Controlled session for debugging
      - name: Maintain Development Session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $started = [datetime]::Parse(
            $env:JOB_STARTED_UTC
          ).ToUniversalTime()

          # Leave time before the GitHub job limit
          $deadline = $started.AddMinutes(335)

          $warned = $false
          $lastLog = [datetime]::MinValue

          Write-Host "Development session active."

          while ((Get-Date).ToUniversalTime() -lt $deadline) {

            $now = (Get-Date).ToUniversalTime()
            $remaining = $deadline - $now

            # Check RDP service health
            $service = Get-Service `
              -Name "TermService" `
              -ErrorAction Stop

            if ($service.Status -ne "Running") {
              Write-Warning "RDP service stopped. Restarting..."
              Start-Service -Name "TermService"
            }

            # Warn before session shutdown
            if (-not $warned -and
                $remaining.TotalMinutes -le 20) {
              Write-Warning "Approximately 20 minutes remaining."
              Write-Warning "Save your development work externally."
              $warned = $true
            }

            # Write health log every ten minutes
            if (($now - $lastLog).TotalMinutes -ge 10) {
              Write-Host "RDP running - $([math]::Ceiling($remaining.TotalMinutes)) minutes remaining."
              $lastLog = $now
            }

            Start-Sleep -Seconds 60
          }

          Write-Host "Debugging session finished."
