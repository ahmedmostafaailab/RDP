
name: Secure Windows RDP + Tailscale V3

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secure-rdp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-2022
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. CONFIGURE WINDOWS AND RDP ACCOUNT
      # ==========================================

      - name: Configure Secure Windows RDP
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== CONFIGURING WINDOWS ==="

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Missing RDP_PASSWORD GitHub Secret."
          }

          if ($env:RDP_PASSWORD.Length -lt 16) {
            throw "RDP password must be at least 16 characters."
          }

          # Record job start time
          $started = [DateTime]::UtcNow.ToString("o")

          Add-Content `
            -Path $env:GITHUB_ENV `
            -Value "JOB_STARTED_UTC=$started"

          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          # Create or update RDP account
          $user = Get-LocalUser -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser `
              -Name "RDP" `
              -Password $securePassword
          }
          else {
            New-LocalUser `
              -Name "RDP" `
              -Password $securePassword `
              -AccountNeverExpires `
              -Description "Temporary development user"
          }

          Enable-LocalUser -Name "RDP"

          # Grant remote desktop access
          $rdpGroup = Get-LocalGroup `
            -SID "S-1-5-32-555"

          $members = Get-LocalGroupMember `
            -Group $rdpGroup.Name

          $account = "$env:COMPUTERNAME\RDP"

          if (-not ($members | Where-Object {
            $_.Name -eq $account
          })) {
            Add-LocalGroupMember `
              -Group $rdpGroup.Name `
              -Member "RDP"
          }

          # Make sure RDP is not an administrator
          $adminGroup = Get-LocalGroup `
            -SID "S-1-5-32-544"

          $adminMembers = Get-LocalGroupMember `
            -Group $adminGroup.Name

          if ($adminMembers | Where-Object {
            $_.Name -eq $account
          }) {
            Remove-LocalGroupMember `
              -Group $adminGroup.Name `
              -Member "RDP"
          }

          # Disable broad RDP firewall rules
          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" `
            -ErrorAction SilentlyContinue |
            Disable-NetFirewallRule

          Write-Host "RDP user configured."
          Write-Host "Password protected by GitHub Secrets."

      # ==========================================
      # 2. INSTALL AND CONNECT TAILSCALE
      # ==========================================

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          hostname: gh-dev-${{ github.run_id }}
          version: latest

      # ==========================================
      # 3. GET TAILSCALE IP WITH RETRIES
      # ==========================================

      - name: Configure Private RDP Access
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "=== TAILSCALE DIAGNOSTICS ==="

          # Find Tailscale executable
          $tsCommand = Get-Command tailscale.exe `
            -ErrorAction SilentlyContinue

          if ($tsCommand) {
            $ts = $tsCommand.Source
          }
          else {
            $ts = Join-Path `
              $env:ProgramFiles `
              "Tailscale\tailscale.exe"
          }

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          Write-Host "Tailscale executable: $ts"

          # Enable unattended networking where supported
          try {
            & $ts set --unattended=true

            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Could not enable unattended mode."
            }
          }
          catch {
            Write-Warning "Unattended mode unavailable."
          }

          # Retrieve IPv4 from structured status
          $tsIP = $null

          for ($attempt = 1; $attempt -le 15; $attempt++) {

            Write-Host "Checking Tailscale - attempt $attempt/15"

            try {
              $rawStatus = & $ts status --json

              if ($LASTEXITCODE -eq 0 -and $rawStatus) {

                $status = $rawStatus | ConvertFrom-Json

                Write-Host "Backend State: $($status.BackendState)"

                $tsIP = @($status.Self.TailscaleIPs) |
                  Where-Object {
                    $_ -is [string] -and $_ -match '^100\.'
                  } |
                  Select-Object -First 1
              }

              # Fallback to standard CLI
              if (-not $tsIP) {
                $result = & $ts ip -4 2>$null

                if ($LASTEXITCODE -eq 0) {
                  $tsIP = @($result) |
                    Where-Object {
                      $_ -is [string] -and $_ -match '^100\.'
                    } |
                    Select-Object -First 1
                }
              }

              if ($tsIP) {
                $tsIP = $tsIP.Trim()
                break
              }
            }
            catch {
              Write-Warning "IP check failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
            Write-Host "=== FINAL TAILSCALE STATUS ==="

            & $ts status

            throw "Tailscale IPv4 unavailable after retries."
          }

          Write-Host "SUCCESS: Tailscale IP = $tsIP"

          # ======================================
          # 4. CONFIGURE PRIVATE FIREWALL
          # ======================================

          Write-Host "=== CONFIGURING FIREWALL ==="

          $adapter = Get-NetAdapter |
            Where-Object {
              $_.Name -like "*Tailscale*" -or
              $_.InterfaceDescription -like "*Tailscale*"
            } |
            Select-Object -First 1

          if (-not $adapter) {
            Write-Host "Available network adapters:"
            Get-NetAdapter |
              Select-Object Name, InterfaceDescription

            throw "Tailscale adapter not found."
          }

          # Remove duplicate custom rule if present
          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          # Allow RDP only through Tailscale
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -Direction Inbound `
            -Action Allow `
            -Enabled True `
            -Protocol TCP `
            -LocalPort 3389 `
            -LocalAddress $tsIP `
            -RemoteAddress "100.64.0.0/10" `
            -InterfaceAlias $adapter.Name `
            -Profile Any | Out-Null

          Write-Host "Private firewall rule created."

          # ======================================
          # 5. ENABLE SECURE REMOTE DESKTOP
          # ======================================

          Write-Host "=== CONFIGURING RDP ==="

          $serverPath = "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server"

          $rdpPath = "$serverPath\WinStations\RDP-Tcp"

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path $serverPath `
            -Name "fDenyTSConnections" `
            -Value 0

          # Enable Network Level Authentication
          Set-ItemProperty `
            -Path $rdpPath `
            -Name "UserAuthentication" `
            -Value 1

          # Require TLS
          Set-ItemProperty `
            -Path $rdpPath `
            -Name "SecurityLayer" `
            -Value 2

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Restart-Service `
            -Name "TermService" `
            -Force

          Start-Sleep -Seconds 5

          # Verify listening port
          $listener = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $listener) {
            throw "RDP not listening on port 3389."
          }

          Write-Host "RDP listener verified."

          # ======================================
          # 6. DISPLAY CONNECTION INFORMATION
          # ======================================

          Write-Host ""
          Write-Host "===================================="
          Write-Host "        RDP CONNECTION READY"
          Write-Host "===================================="
          Write-Host "Computer : $tsIP"
          Write-Host "Username : .\RDP"
          Write-Host "Port     : 3389"
          Write-Host "Password : GitHub Secret"
          Write-Host "===================================="
          Write-Host ""

          # Save non-sensitive connection details
          @(
            "## Secure Windows RDP"
            ""
            "**Tailscale IP:** $tsIP"
            ""
            "**Username:** ``.\RDP``"
            ""
            "**Port:** 3389"
            ""
            "**Status:** RDP listener verified"
          ) | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Encoding utf8 `
            -Append

      # ==========================================
      # 7. SYSTEM DIAGNOSTICS
      # ==========================================

      - name: System Diagnostics
        shell: pwsh
        run: |
          Write-Host "=== WINDOWS ==="

          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version

          Write-Host "=== PROCESSOR ==="

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfLogicalProcessors

          Write-Host "=== MEMORY ==="

          Get-CimInstance Win32_ComputerSystem |
            Select-Object TotalPhysicalMemory

          Write-Host "=== STORAGE ==="

          Get-PSDrive C

          Write-Host "=== RDP SERVICE ==="

          Get-Service TermService

          Write-Host "=== FIREWALL ==="

          Get-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only"

      # ==========================================
      # 8. KEEP DEVELOPMENT SESSION ACTIVE
      # ==========================================

      - name: Maintain Development Session
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $started = [datetime]::Parse(
            $env:JOB_STARTED_UTC
          ).ToUniversalTime()

          # End before GitHub's hard job timeout
          $deadline = $started.AddMinutes(335)

          $warned = $false
          $lastLog = [datetime]::MinValue

          Write-Host "Development session active."
          Write-Host "Save work externally before shutdown."

          while ((Get-Date).ToUniversalTime() -lt $deadline) {

            $now = (Get-Date).ToUniversalTime()

            $remaining = $deadline - $now

            # Check RDP service health
            $service = Get-Service `
              -Name "TermService"

            if ($service.Status -ne "Running") {
              Write-Warning "RDP service stopped."

              Start-Service -Name "TermService"
            }

            # Warning in GitHub Actions logs
            if (-not $warned -and
                $remaining.TotalMinutes -le 20) {

              Write-Warning "20 minutes remaining."
              Write-Warning "Save your files externally."

              $warned = $true
            }

            # Report status every ten minutes
            if (($now - $lastLog).TotalMinutes -ge 10) {

              $minutes = [math]::Ceiling(
                $remaining.TotalMinutes
              )

              Write-Host "RDP Active | Remaining: $minutes min"

              $lastLog = $now
            }

            Start-Sleep -Seconds 60
          }

          Write-Host "Development session finished."
